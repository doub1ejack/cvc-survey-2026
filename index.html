      // Helper to get raw cell value defensively from Notion properties
      // Supports case-insensitive matching, multi-option aliases, joining rich text, and Likert decoding.
      function getPropValue(page, propName, type, defaultValue) {
        if (!page || !page.properties) return defaultValue;

        // Normalize propName to an array of lowercase strings for matching
        const names = (Array.isArray(propName) ? propName : [propName]).map(
          (x) => x.toLowerCase().trim(),
        );

        // Look up key in page.properties case-insensitively
        let actualKey = null;
        for (const name of names) {
          actualKey = Object.keys(page.properties).find(
            (k) => k.toLowerCase().trim() === name,
          );
          if (actualKey) break;
        }

        if (!actualKey) return defaultValue;
        const prop = page.properties[actualKey];
        if (!prop) return defaultValue;

        switch (type) {
          case "title":
            return prop.title?.[0]?.plain_text || defaultValue;
          case "rich_text":
            if (Array.isArray(prop.rich_text)) {
              return (
                prop.rich_text.map((x) => x.plain_text).join("") || defaultValue
              );
            }
            return defaultValue;
          case "select":
            return prop.select?.name || defaultValue;
          case "multi_select":
            return Array.isArray(prop.multi_select)
              ? prop.multi_select.map((x) => x.name)
              : defaultValue;
          case "number":
            return typeof prop.number === "number" ? prop.number : defaultValue;
          case "likert_score":
            if (prop.type === "number" && typeof prop.number === "number") {
              return prop.number;
            }
            if (prop.type === "select" && prop.select) {
              const val = prop.select.name;
              if (!val) return defaultValue;
              if (!isNaN(val)) return Number(val);
              const map = {
                SA: 5,
                A: 4,
                N: 3,
                D: 2,
                SD: 1,
              };
              return map[val.toUpperCase()] || defaultValue;
            }
            return defaultValue;
          default:
            return defaultValue;
        }
      }

      // API fetch logic
      async function fetchData(config, useDemo) {
        if (useDemo) {
          return new Promise((resolve) => {
            setTimeout(() => resolve(DEMO_PAGES), 400); // Small delay for realistic feel
          });
        }

        // Fetch from local Express proxy
        const headers = {
          "x-notion-api-key": config.NOTION_API_KEY,
          "x-notion-database-id": config.NOTION_DATABASE_ID,
        };

        try {
          const response = await fetch(config.PROXY_URL, { headers });
          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            console.warn(
              "Proxy fetch failed, falling back to demo data:",
              errJson.error || response.status,
            );
            return DEMO_PAGES;
          }
          const data = await response.json();
          return data.results || [];
        } catch (e) {
          console.warn("Fetch error, using demo data:", e);
          return DEMO_PAGES;
        }
      }

      // Data transformation and anonymization engine
      function transformData(rawPages) {
        // 1. Sort pages stably by their ID to ensure deterministic mapping
        const sortedPages = [...rawPages].sort((a, b) =>
          (a.id || "").localeCompare(b.id || ""),
        );

        // 2. Generate deterministic anonymized name map using Notion UID field
        const anonMap = new Map();
        sortedPages.forEach((page, idx) => {
          const inventedIndex = idx % INVENTED_NAMES.length;
          const namePrefix = INVENTED_NAMES[inventedIndex];
          const uid = getPropValue(page, "UID", "number", idx + 1);
          const paddedUid = String(uid).padStart(2, "0");
          const anonName = `${namePrefix}-${paddedUid}`;
          anonMap.set(page.id, anonName);
        });

        // 3. Transform and clean records defensively
        return sortedPages.map((page) => {
          const anonName = anonMap.get(page.id);

          // Map Notion properties to clean object fields
          const tenure = getPropValue(page, "Tenure", "select", "0-2 yrs");
          const fulfillment = getPropValue(
            page,
            "Fulfillment",
            "select",
            "Somewhat",
          );
          const govSatisfaction = getPropValue(
            page,
            ["Governance Satisfaction", "Governance satisfaction"],
            "select",
            "Somewhat satisfied",
          );
          const hoursPerMonth = getPropValue(
            page,
            "Hours/month",
            "select",
            "0-2",
          );

          // Extract and coerce Likert scales Q13-Q24 to numbers (fallback to 3/Neutral)
          const q13 = Number(
            getPropValue(
              page,
              ["Q13", "Q13 Treated respectfully"],
              "likert_score",
              3,
            ),
          );
          const q14 = Number(
            getPropValue(
              page,
              ["Q14", "Q14 Efforts appreciated"],
              "likert_score",
              3,
            ),
          );
          const q15 = Number(
            getPropValue(page, ["Q15", "Q15 Voice heard"], "likert_score", 3),
          );
          const q16 = Number(
            getPropValue(
              page,
              ["Q16", "Q16 Participation path clear"],
              "likert_score",
              3,
            ),
          );
          const q22 = Number(
            getPropValue(
              page,
              ["Q22", "Q22 Balance obligations"],
              "likert_score",
              3,
            ),
          );
          const q23 = Number(
            getPropValue(
              page,
              ["Q23", "Q23 Land/facilities maintained"],
              "likert_score",
              3,
            ),
          );
          const q24 = Number(
            getPropValue(
              page,
              ["Q24", "Q24 Satisfied participation level"],
              "likert_score",
              3,
            ),
          );

          // Extract Row tags (19 analytical codes) separately from Open codes (granular codes)
          const tags = getPropValue(
            page,
            ["Tags", "Row tags"],
            "multi_select",
            [],
          );
          const openCodes = getPropValue(
            page,
            "Open codes",
            "multi_select",
            [],
          );

          // Extract text excerpts defensively
          const govComments = getPropValue(
            page,
            ["Governance Comments", "Governance comments"],
            "rich_text",
            "",
          );
          const favoritePart = getPropValue(
            page,
            ["Favorite Part", "Favorite part"],
            "rich_text",
            "",
          );
          const growthAreas = getPropValue(
            page,
            ["Areas of Growth", "Areas of growth"],
            "rich_text",
            "",
          );
          const barriers = getPropValue(
            page,
            ["Participation Barriers", "Participation barriers"],
            "rich_text",
            "",
          );

          // Build structured clean survey response object
          return {
            id: page.id,
            anonName,
            tenure,
            fulfillment,
            govSatisfaction,
            hoursPerMonth,
            likert: { q13, q14, q15, q16, q22, q23, q24 },
            tags,
            openCodes,
            excerpts: {
              govComments,
              favoritePart,
              growthAreas,
              barriers,
            },
          };
        });
      }

      // D3 Force Directed Bubble Chart Component
      function BubbleChart({ tagData, selectedTag, onSelectTag, setTooltip }) {
        const containerRef = useRef(null);
        const svgRef = useRef(null);

        useEffect(() => {
          if (!containerRef.current || !svgRef.current) return;

          const container = containerRef.current;
          const svg = d3.select(svgRef.current);
          svg.selectAll("*").remove(); // Clear previous drawing

          // Track current dimensions in a mutable object so tick/resize closures stay current
          const dims = {
            w: container.clientWidth || 600,
            h: container.clientHeight || 500,
          };

          svg.attr("width", dims.w).attr("height", dims.h);

          // Filter out zero-count tags to keep display clean and dense
          const dataset = tagData.filter((d) => d.count > 0);

          if (dataset.length === 0) {
            svg
              .append("text")
              .attr("x", dims.w / 2)
              .attr("y", dims.h / 2)
              .attr("text-anchor", "middle")
              .attr("class", "text-slate-400 font-semibold text-sm")
              .text("No survey responses with codes matches currently.");
            return;
          }

          // Radii scale area-proportional
          const counts = dataset.map((d) => d.count);
          const radiusScale = d3
            .scaleSqrt()
            .domain([1, d3.max(counts) || 1])
            .range([40, 90]);

          // Pack the data inside D3 force nodes — initialize positions at center
          const nodes = dataset.map((d, i) => ({
            ...d,
            radius: radiusScale(d.count),
            x: dims.w / 2 + (Math.random() - 0.5) * 50,
            y: dims.h / 2 + (Math.random() - 0.5) * 50,
          }));

          // Centering forces pull nodes toward the middle of the canvas
          const forceX = d3.forceX(dims.w / 2).strength(0.2);
          const forceY = d3.forceY(dims.h / 2).strength(0.2);

          // Collision force with iterations to fully resolve overlaps
          const collideForce = d3
            .forceCollide((d) => d.radius + 5)
            .iterations(4);

          // Simulation setup
          const simulation = d3
            .forceSimulation(nodes)
            .force("x", forceX)
            .force("y", forceY)
            .force("collide", collideForce)
            .alphaMin(0.001)
            .velocityDecay(0.3);

          // Circle groups
          const elem = svg
            .selectAll("g")
            .data(nodes)
            .enter()
            .append("g")
            .style("cursor", "pointer")
            .on("click", (event, d) => {
              onSelectTag(d.name);
              // Selected node brief pulse animation
              d3.select(event.currentTarget)
                .select("circle")
                .transition()
                .duration(150)
                .attr("transform", "scale(1.2)")
                .transition()
                .duration(150)
                .attr("transform", "scale(1)");
            })
            .on("mousemove", (event, d) => {
              const bounds = container.getBoundingClientRect();
              const x = event.clientX - bounds.left;
              const y = event.clientY - bounds.top;
              setTooltip({
                show: true,
                x,
                y,
                tag: d.name,
                count: d.count,
                type: d.type,
              });
            })
            .on("mouseleave", () => {
              setTooltip((prev) => ({ ...prev, show: false }));
            });

          // Background gradients for nodes
          const defs = svg.append("defs");

          // Define Theme Gradient (Indigo/Violet)
          const themeGrad = defs
            .append("linearGradient")
            .attr("id", "themeGrad")
            .attr("x1", "0%")
            .attr("y1", "0%")
            .attr("x2", "100%")
            .attr("y2", "100%");
          themeGrad
            .append("stop")
            .attr("offset", "0%")
            .attr("stop-color", "#7461F3");
          themeGrad
            .append("stop")
            .attr("offset", "100%")
            .attr("stop-color", "#9B8DF7");

          // Define Signal Gradient (Rose/Amber)
          const signalGrad = defs
            .append("linearGradient")
            .attr("id", "signalGrad")
            .attr("x1", "0%")
            .attr("y1", "0%")
            .attr("x2", "100%")
            .attr("y2", "100%");
          signalGrad
            .append("stop")
            .attr("offset", "0%")
            .attr("stop-color", "#F56939");
          signalGrad
            .append("stop")
            .attr("offset", "100%")
            .attr("stop-color", "#F7935F");

          // Render SVG Circles
          const circles = elem
            .append("circle")
            .attr("r", (d) => d.radius)
            .attr(
              "class",
              "shadow-sm hover:brightness-105 transition-all duration-300 origin-center",
            )
            .attr("fill", (d) =>
              d.type === "Theme" ? "url(#themeGrad)" : "url(#signalGrad)",
            )
            .attr("stroke", "transparent")
            .attr("stroke-width", 0);

          // Render Labels (Tag Name + count)
          elem
            .append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "-2")
            .attr("fill", "white")
            .attr("class", "font-bold select-none pointer-events-none")
            .style("font-size", (d) => `${Math.min(d.radius / 4.2, 12)}px`)
            .text((d) => {
              const limit = Math.floor(d.radius / 3.5);
              return d.name.length > limit
                ? d.name.substring(0, limit - 2) + ".."
                : d.name;
            });

          elem
            .append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "12")
            .attr("fill", "rgba(255, 255, 255, 0.85)")
            .attr("class", "font-medium select-none pointer-events-none")
            .style("font-size", (d) => `${Math.min(d.radius / 4.8, 10)}px`)
            .text((d) => `n=${d.count}`);

          // Update positions based on force simulation ticks
          simulation.on("tick", () => {
            elem.attr("transform", (d) => {
              // Soft clamping using current dims — don't fight collision force
              const margin = d.radius;
              d.x = Math.max(margin, Math.min(dims.w - margin, d.x));
              d.y = Math.max(margin, Math.min(dims.h - margin, d.y));
              return `translate(${d.x}, ${d.y})`;
            });
          });

          // Resize observer — update dims, re-center and restart simulation
          const handleResize = () => {
            if (!containerRef.current) return;
            const w = containerRef.current.clientWidth;
            const h = containerRef.current.clientHeight;
            if (w === 0 || h === 0) return;
            dims.w = w;
            dims.h = h;
            svg.attr("width", w).attr("height", h);
            simulation.force("x", d3.forceX(w / 2).strength(0.2));
            simulation.force("y", d3.forceY(h / 2).strength(0.2));
            simulation.alpha(0.8).restart();
          };

          const resizeObserver = new ResizeObserver(handleResize);
          resizeObserver.observe(container);

          return () => {
            simulation.stop();
            resizeObserver.disconnect();
          };
        }, [tagData]);

        // Highlight selected bubble without rebuilding simulation
        useEffect(() => {
          if (!svgRef.current) return;
          const svg = d3.select(svgRef.current);
          svg
            .selectAll("circle")
            .attr("stroke", function (d) {
              return d && d.name === selectedTag ? "#0f172a" : "transparent";
            })
            .attr("stroke-width", function (d) {
              return d && d.name === selectedTag ? 3 : 0;
            });
        }, [selectedTag]);

        return (
          <div
            ref={containerRef}
            className="viz-bubble-chart w-full absolute inset-0"
          >
            <svg ref={svgRef} className="w-full h-full select-none" />
          </div>
        );
      }

          label: "No Barriers Named",
        },
      };
      const BARRIER_CATEGORY_ORDER = [
        "Governance/Structural",
        "Social/Climate",
        "Life/Capacity",
        "No Barriers Named",
      ];

      const BARRIER_AXIS_OPTIONS = [
        { key: "tenure", label: "Tenure", groups: TENURE_GROUPS },
        {
          key: "fulfillment",
          label: "Fulfillment",
          groups: ["Yes", "Somewhat", "No"],
        },
        {
          key: "govSatisfaction",
          label: "Gov Satisfaction",
          groups: [
            "Very satisfied",
            "Somewhat satisfied",
            "Somewhat dissatisfied",
            "Very dissatisfied",
          ],
        },
      ];

      function classifyBarrierType(respondent) {
        const respondentTags = respondent.tags || [];
        const scores = {};
        BARRIER_CATEGORY_ORDER.forEach((cat) => (scores[cat] = 0));
        respondentTags.forEach((tag) => {
          BARRIER_CATEGORY_ORDER.forEach((cat) => {
            if (BARRIER_CATEGORIES[cat].tags.includes(tag)) {
              scores[cat] += 1;
            }
          });
        });
        // If no barrier-relevant tags at all, classify as "No Barriers Named"
        const totalBarrierScore =
          scores["Governance/Structural"] +
          scores["Social/Climate"] +
          scores["Life/Capacity"];
        if (totalBarrierScore === 0) return "No Barriers Named";
        // Highest score wins; ties broken by priority order (Governance > Social > Life)
        let best = "No Barriers Named";
        let bestScore = 0;
        ["Governance/Structural", "Social/Climate", "Life/Capacity"].forEach(
          (cat) => {
            if (scores[cat] > bestScore) {
              bestScore = scores[cat];
              best = cat;
            }
          },
        );
        return best;
      }

      function getBarrierMatchingTags(respondent, category) {
        const respondentTags = respondent.tags || [];
        const catTags = BARRIER_CATEGORIES[category]?.tags || [];
        return respondentTags.filter((t) => catTags.includes(t));
      }

      // Distinct D3 colors for each question so we can track them in animation
      const QUESTION_COLORS = {
        q13: "#5A9BD5", // Soft steel blue
        q14: "#8CBE6E", // Sage green
        q15: "#D4808A", // Dusty pink
        q16: "#76b7b2", // Teal (unchanged)
        q22: "#6BAF8D", // Muted seafoam
        q23: "#C9B96C", // Muted ochre/gold
        q24: "#8B98A8", // Cool slate-blue
      };

      function TenureArcTab({ data }) {
        const [selectedTenure, setSelectedTenure] = useState("0-2 yrs");
        const [tooltip, setTooltip] = useState({
          show: false,
          x: 0,
          y: 0,
          code: "",
          fullText: "",
          score: 0,
          n: 0,
        });

        // Group data by tenure and calculate count
        const tenureCounts = useMemo(() => {
          const counts = {
            "0-2 yrs": 0,
            "3-5 yrs": 0,
            "6-10 yrs": 0,
            "10+ yrs": 0,
          };
          data.forEach((d) => {
            if (counts[d.tenure] !== undefined) counts[d.tenure] += 1;
          });
          return counts;
        }, [data]);

        // Calculate mean scores specifically for the active tenure group
        const scoresForTenure = useMemo(() => {
          const result = {};

          // Filter respondents in this tenure group
          const groupMembers = data.filter((d) => d.tenure === selectedTenure);
          const n = groupMembers.length;

          Object.keys(LIKERT_QUESTIONS).forEach((qKey) => {
            if (n === 0) {
              result[qKey] = { qKey, score: 3.0, n: 0 }; // default
              return;
            }

            const sum = groupMembers.reduce(
              (acc, current) => acc + (current.likert[qKey] || 3),
              0,
            );
            const mean = Number((sum / n).toFixed(2));
            result[qKey] = { qKey, score: mean, n };
          });

          return Object.values(result);
        }, [data, selectedTenure]);

        return (
          <div className="bg-white rounded-2xl border border-slate-200/60 shadow-sm p-6 flex flex-col min-h-0 max-h-[85vh] relative">
            {/* Header */}
            <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 border-b border-slate-100 pb-4 mb-4">
              <div>
                <h2 className="text-xl font-bold tracking-tight text-slate-800">
                  People's experiences over time feel?
                </h2>
                <p className="text-xs text-slate-400 font-semibold">
                  Each dot is one survey question. Step through the buttons to
                  see how answers shift across tenure groups.
                </p>
              </div>

              {/* Tenure Segmented Control Selector */}
              <div className="flex bg-slate-100 p-1 rounded-xl shadow-inner shrink-0 border border-slate-200/50 axis-control-bar">
                {TENURE_GROUPS.map((grp) => (
                  <button
                    key={grp}
                    onClick={() => setSelectedTenure(grp)}
                    className={`px-4 py-2 text-xs font-bold rounded-lg transition-all duration-300 flex items-center space-x-1 focus:outline-none ${
                      selectedTenure === grp
                        ? "bg-white text-slate-900 shadow-sm border border-slate-200"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    <span>{grp}</span>
                    <span className="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded text-slate-500 font-medium">
                      n={tenureCounts[grp]}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            {/* Orientation Summary Block */}
            <div className="bg-slate-50 border-l-4 border-emerald-500 p-4 rounded-r-xl text-slate-600 text-sm mb-6 leading-relaxed">
              {SUMMARY_TEXT_2}
            </div>

            {/* Canvas Dot Plot Area */}
            <div className="relative" style={{ height: "500px" }}>
              <TenureDotPlot scores={scoresForTenure} setTooltip={setTooltip} />

              {/* Custom Tooltip */}
              {tooltip.show && (
                <div
                  className="absolute bg-slate-900/95 text-white text-xs rounded-xl p-4 shadow-xl pointer-events-none z-30 transition-all border border-slate-700 max-w-[280px]"
                  style={{
                    left: `${tooltip.x + 10}px`,
                    top: `${tooltip.y + 10}px`,
                  }}
                >
                  {tooltip.labelOnly ? (
                    <div>
                      <div className="font-bold border-b border-slate-700 pb-1.5 mb-1.5 tracking-wide">
                        {tooltip.code}
                      </div>
                      <div className="text-slate-200 leading-relaxed">
                        {tooltip.fullText}
                      </div>
                    </div>

                    <div>
                      <div className="font-bold border-b border-slate-700 pb-1.5 mb-1.5 flex justify-between items-center text-xs tracking-wide">
                        <span>
                          {tooltip.code} - {tooltip.fullText}
                        </span>
                        <span className="text-[10px] bg-emerald-500 text-slate-900 px-1.5 py-0.5 rounded-full font-bold">
                          {tooltip.n}
                        </span>
                      </div>
                      <div className="flex justify-between border-t border-slate-800 pt-1.5">
                        <span className="text-slate-400 font-semibold">

                        </span>

                          {tooltip.score} / 5.0
                        </span>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );

      // D3 Horizontal Dot Plot
      function TenureDotPlot({ scores, setTooltip }) {
        const containerRef = useRef(null);
        const svgRef = useRef(null);

        useEffect(() => {
          if (!containerRef.current || !svgRef.current) return;

          const container = containerRef.current;
          const svg = d3.select(svgRef.current);

          const width = container.clientWidth;
          const height = container.clientHeight;

          const margin = { top: 20, right: 40, bottom: 40, left: 180 };
          const chartWidth = width - margin.left - margin.right;
          const chartHeight = height - margin.top - margin.bottom;

          // Check if size has actually changed to avoid full redraw
          const prevWidth = svg.attr("data-width");
          const prevHeight = svg.attr("data-height");
          const sizeChanged =
            prevWidth !== String(width) || prevHeight !== String(height);

          // Scales
          const xScale = d3
            .scaleLinear()
            .domain([1.0, 5.0])
            .range([0, chartWidth]);

          const yScale = d3
            .scalePoint()
            .domain(Object.keys(LIKERT_QUESTIONS))
            .range([0, chartHeight])
            .padding(0.5);

          let g;

          if (sizeChanged) {
            svg.selectAll("*").remove(); // Only wipe on resize
            svg.attr("data-width", width).attr("data-height", height);
            svg.attr("width", width).attr("height", height);

            g = svg
              .append("g")
              .attr("class", "main-group")
              .attr("transform", `translate(${margin.left}, ${margin.top})`);

            // Add background guides / gridlines for orientation
            g.append("g")
              .attr("class", "grid text-slate-200")
              .attr("transform", `translate(0, ${chartHeight})`)
              .call(d3.axisBottom(xScale).ticks(5).tickSize(-chartHeight))
              .call((g) => g.select(".domain").remove())
              .call((g) =>
                g
                  .selectAll(".tick line")
                  .attr("stroke", "#e2e8f0")
                  .attr("stroke-dasharray", "4,4"),
              );

            // Add fixed reference line at 3.0 (Neutral threshold)
            g.append("line")
              .attr("class", "ref-line")
              .attr("x1", xScale(3.0))
              .attr("x2", xScale(3.0))
              .attr("y1", 0)
              .attr("y2", chartHeight)
              .attr("stroke", "#94a3b8")
              .attr("stroke-width", 1.5)
              .attr("stroke-dasharray", "6,4")
              .style("opacity", 0.7);

            // Y-Axis labels (Question Codes / short labels)
            const yAxisG = g
              .append("g")
              .attr("class", "y-axis text-slate-600 font-semibold select-none")
              .call(
                d3
                  .axisLeft(yScale)
                  .tickFormat((d) => LIKERT_QUESTIONS[d].shortName),
              )
              .call((g) => g.select(".domain").remove())
              .call((g) => g.selectAll(".tick line").remove());
            yAxisG
              .selectAll("text")
              .style("font-size", "11px")
              .style("cursor", "help")
              .on("mousemove", (event, d) => {
                const bounds = container.getBoundingClientRect();
                const x = event.clientX - bounds.left;
                const y = event.clientY - bounds.top;
                setTooltip({
                  show: true,
                  x,
                  y,
                  code: LIKERT_QUESTIONS[d].code,
                  fullText: LIKERT_QUESTIONS[d].fullName,
                  score: null,
                  n: null,
                  labelOnly: true,
                });
              })
              .on("mouseleave", () => {
                setTooltip((prev) => ({ ...prev, show: false }));
              });

            // X-Axis labels
            g.append("g")
              .attr("class", "x-axis text-slate-400 font-bold select-none")
              .attr("transform", `translate(0, ${chartHeight})`)
              .call(
                d3
                  .axisBottom(xScale)
                  .tickValues([1, 2, 3, 4, 5])
                  .tickFormat((d) => {
                    const labels = {
                      1: "Strong Disagree (1)",
                      2: "2",
                      3: "3 (Neutral)",
                      4: "4",
                      5: "Strong Agree (5)",
                    };
                    return labels[d];
                  }),
              )
              .selectAll("text")
              .style("font-size", "10px")
              .attr("dy", "10");

            // Render question row horizontal background lanes for cleaner scanning
            // Set background lane stroke-width to 20 for a gorgeous thick track layout!
            g.selectAll(".lane")
              .data(Object.keys(LIKERT_QUESTIONS))
              .enter()
              .append("line")
              .attr("class", "lane")
              .attr("x1", 0)
              .attr("x2", chartWidth)
              .attr("y1", (d) => yScale(d))
              .attr("y2", (d) => yScale(d))
              .attr("stroke", "#f1f5f9")
              .attr("stroke-width", yScale.step() * 0.6)
              .style("opacity", 0.5)
              .style("z-index", -1);
          } else {
            g = svg.select("g.main-group");
          }

          // Draw and update animated score dots
          const dots = g.selectAll(".score-dot").data(scores, (d) => d.qKey);

          dots
            .enter()
            .append("circle")
            .attr(
              "class",
              "score-dot cursor-pointer shadow-md origin-center transition-all duration-200",
            )
            .attr("r", 11)
            .attr("fill", (d) => QUESTION_COLORS[d.qKey])
            .attr("cy", (d) => yScale(d.qKey))
            .attr("cx", (d) => xScale(d.score))
            .on("mousemove", (event, d) => {
              const bounds = container.getBoundingClientRect();
              const x = event.clientX - bounds.left;
              const y = event.clientY - bounds.top;
              setTooltip({
                show: true,
                x,
                y,
                code: LIKERT_QUESTIONS[d.qKey].code,
                fullText: LIKERT_QUESTIONS[d.qKey].fullName,
                score: d.score,
                n: d.n,
              });
            })
            .on("mouseleave", () => {
              setTooltip((prev) => ({ ...prev, show: false }));
            })
            .merge(dots)
            .transition()
            .duration(650)
            .ease(d3.easeCubicInOut)
            .attr("cx", (d) => xScale(d.score));

          dots.exit().remove();

          // Resize observer handler to dynamically adjust on window shifts
          const handleResize = () => {
            if (!containerRef.current) return;
            const w = containerRef.current.clientWidth;
            const h = containerRef.current.clientHeight;
            svg.attr("data-width", w).attr("data-height", h);
            svg.attr("width", w).attr("height", h);
            const cW = w - margin.left - margin.right;
            const cH = h - margin.top - margin.bottom;

            xScale.range([0, cW]);
            yScale.range([0, cH]);

            svg.selectAll(".lane").attr("x2", cW);
            svg.select(".grid").selectAll("line").attr("x2", cW);
            svg
              .select(".ref-line")
              .attr("x1", xScale(3.0))
              .attr("x2", xScale(3.0))
              .attr("y2", cH);

            g.selectAll(".score-dot")
              .attr("cx", (d) => xScale(d.score))
              .attr("cy", (d) => yScale(d.qKey));
          };

          const resizeObserver = new ResizeObserver(handleResize);
          resizeObserver.observe(container);

          return () => resizeObserver.disconnect();
        }, [scores]);

        return (
          <div
            ref={containerRef}
            className="viz-tenure-arc w-full absolute inset-0"
          >
            <svg ref={svgRef} className="w-full h-full" />
          </div>
        );
      }

      // ==========================================
      // TAB 3: Fulfillment vs Governance satisfaction
      // ==========================================

      const FULFILLMENT_LEVELS = ["Yes", "Somewhat", "No"];
      const SATISFACTION_LEVELS = [
        "Very satisfied",
        "Somewhat satisfied",
        "Somewhat dissatisfied",
        "Not at all satisfied",
      ];

      const HOURS_GROUPS = ["0-2", "2-5", "6-10", "10+"];

      const FULFILLMENT_AXIS_OPTIONS = [
        {
          key: "govSatisfaction",
          label: "Gov Satisfaction",
          levels: SATISFACTION_LEVELS,
          axisTitle: "Governance Satisfaction",
        },
        {
          key: "hoursPerMonth",
          label: "Hours/Month",
          levels: HOURS_GROUPS,
          axisTitle: "Hours per Month",
        },
        {
          key: "tenure",
          label: "Tenure",
          levels: TENURE_GROUPS,
          axisTitle: "Tenure",
        },
      ];

      const FULFILLMENT_SUMMARIES = {
        govSatisfaction:
          "If these two things were closely connected, you'd see most people clustered along the diagonal. Off-diagonal circles mean someone is fulfilled despite governance frustration, or dissatisfied despite governance satisfaction.",
        hoursPerMonth:
          "If fulfillment tracked time investment, you'd see a clean diagonal. Off-diagonal circles mean someone is fulfilled despite low hours, or putting in time without feeling fulfilled.",
        tenure:
          "If fulfillment grew with time in community, you'd see a clean diagonal. Off-diagonal circles mean someone is fulfilled despite being new, or has been here a long time without feeling fulfilled.",
      };

      function isAlignedCell(fulfillment, xValue, axisKey) {
        const fulIdx = FULFILLMENT_LEVELS.indexOf(fulfillment); // 0=Yes, 1=Somewhat, 2=No
        if (axisKey === "govSatisfaction") {
          const xIdx = SATISFACTION_LEVELS.indexOf(xValue);
          if (fulIdx === 0) return xIdx <= 1;
          if (fulIdx === 1) return xIdx === 1 || xIdx === 2;
          return xIdx >= 2;
        }
        if (axisKey === "hoursPerMonth") {
          const xIdx = HOURS_GROUPS.indexOf(xValue);
          if (fulIdx === 0) return xIdx >= 1;
          if (fulIdx === 1) return true;
          return xIdx <= 1;
        }
        if (axisKey === "tenure") {
          const xIdx = TENURE_GROUPS.indexOf(xValue);
          if (fulIdx === 0) return xIdx >= 1;
          if (fulIdx === 1) return true;
          return xIdx <= 1;
        }
        return true;
      }

      function FulfillmentGridTab({ data }) {
        const [selectedCell, setSelectedCell] = useState(null); // 'fulfillment|xValue'
        const [axisKey, setAxisKey] = useState("govSatisfaction");
        const [tooltip, setTooltip] = useState({
          show: false,
          x: 0,
          y: 0,
          count: 0,
          ful: "",
          sat: "",
        });

        const axisOption = FULFILLMENT_AXIS_OPTIONS.find(
          (o) => o.key === axisKey,
        );
        const xLevels = axisOption.levels;
        const xAxisTitle = axisOption.axisTitle;

        // Clear selection when axis changes
        useEffect(() => {
          setSelectedCell(null);
        }, [axisKey]);

        // Transform raw dataset into 2D Grid Cell stats
        const gridStats = useMemo(() => {
          // Initialize cells
          const matrix = {};
          FULFILLMENT_LEVELS.forEach((f) => {
            xLevels.forEach((s) => {
              matrix[`${f}|${s}`] = {
                fulfillment: f,
                satisfaction: s,
                count: 0,
                respondents: [],
                tags: {},
              };
            });
          });

          // Populate cell lists
          data.forEach((d) => {
            const key = `${d.fulfillment}|${d[axisKey]}`;
            if (matrix[key]) {
              matrix[key].count += 1;
              matrix[key].respondents.push(d);

              // Increment tag counters
              if (Array.isArray(d.tags)) {
                d.tags.forEach((tag) => {
                  matrix[key].tags[tag] = (matrix[key].tags[tag] || 0) + 1;
                });
              }
            }
          });

          return Object.values(matrix);
        }, [data, axisKey, xLevels]);

        // Active cell information
        const activeCellData = useMemo(() => {
          if (!selectedCell) return null;
          return gridStats.find(
            (cell) =>
              `${cell.fulfillment}|${cell.satisfaction}` === selectedCell,
          );
        }, [selectedCell, gridStats]);

        return (
          <div className="flex flex-col md:flex-row gap-6 min-h-0 max-h-[85vh]">
            {/* Main Visual grid Card */}
            <div className="flex-1 bg-white rounded-2xl border border-slate-200/60 shadow-sm p-6 flex flex-col min-h-0 relative">
              <div>
                <div className="flex items-center justify-between flex-wrap gap-3 mb-3">
                  <div>
                    <h2 className="text-xl font-bold tracking-tight text-slate-800">
                      How does fulfillment align with governance?
                    </h2>
                    <p className="text-xs text-slate-400 font-semibold">
                      Each circle is a group of respondents. Gray = fulfillment
                      and governance satisfaction align. Gold = they don't —
                      these are the most interesting cells.
                    </p>
                  </div>
                  <AxisControlBar
                    options={FULFILLMENT_AXIS_OPTIONS}
                    activeKey={axisKey}
                    onChange={setAxisKey}
                  />
                </div>

                {/* Summary panel */}
                <div className="bg-slate-50 border-l-4 border-emerald-500 p-4 rounded-r-xl text-slate-600 text-sm mb-4 leading-relaxed">
                  {FULFILLMENT_SUMMARIES[axisKey]}
                </div>
              </div>

              {/* Matrix Canvas Container */}
              <div className="relative" style={{ height: "500px" }}>
                <FulfillmentGrid
                  cells={gridStats}
                  selectedCell={selectedCell}
                  onSelectCell={setSelectedCell}
                  setTooltip={setTooltip}
                  xLevels={xLevels}
                  xAxisTitle={xAxisTitle}
                  axisKey={axisKey}
                />
              </div>

              {/* Custom Tooltip */}
              {tooltip.show && (
                <div
                  className="absolute bg-slate-900/95 text-white text-xs rounded-xl p-3 shadow-xl pointer-events-none z-30 transition-all border border-slate-700 max-w-[220px]"
                  style={{
                    left: `${tooltip.x + 10}px`,
                    top: `${tooltip.y + 10}px`,
                  }}
                >
                  <div className="font-bold border-b border-slate-700 pb-1 mb-1.5 tracking-wide text-xs">
                    Intersection Profile
                  </div>
                  <div className="space-y-1 mb-2">
                    <div className="flex justify-between space-x-2">
                      <span className="text-slate-400 font-semibold">
                        Fulfillment:
                      </span>
                      <span className="font-bold text-white">
                        {tooltip.ful}
                      </span>
                    </div>
                    <div className="flex justify-between space-x-2">
                      <span className="text-slate-400 font-semibold">
                        {xAxisTitle + ":"}
                      </span>
                      <span className="font-bold text-white">
                        {tooltip.sat}
                      </span>

                  <div className="flex justify-between border-t border-slate-800 pt-1.5">
                    <span className="text-slate-400 font-semibold">Count:</span>
                    <span className="font-bold text-emerald-400">
                      {tooltip.count} respondents

                </div>

            </div>

          </div>
        );
      }

      // D3 fulfillment matrix grid chart
      function FulfillmentGrid({
        cells,
        selectedCell,
        onSelectCell,
        setTooltip,
        xLevels,
        xAxisTitle,
        axisKey,
      }) {
        const containerRef = useRef(null);
        const svgRef = useRef(null);

        useEffect(() => {
          if (!containerRef.current || !svgRef.current) return;

          const container = containerRef.current;
          const svg = d3.select(svgRef.current);
          svg.selectAll("*").remove(); // Clear previous drawing

          const width = container.clientWidth;
          const height = container.clientHeight;

          const margin = { top: 30, right: 40, bottom: 60, left: 100 };
          const chartWidth = width - margin.left - margin.right;
          const chartHeight = height - margin.top - margin.bottom;

          svg.attr("width", width).attr("height", height);

          const g = svg
            .append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);

          // Scales
          const xScale = d3
            .scalePoint()
            .domain(xLevels)
            .range([0, chartWidth])
            .padding(0.5);

          const yScale = d3
            .scalePoint()
            .domain(FULFILLMENT_LEVELS)
            .range([0, chartHeight])
            .padding(0.5);

          // Maximum size of circle (half the spacing between points)
          const maxCircleRadius =
            Math.min(
              chartWidth / xLevels.length,
              chartHeight / FULFILLMENT_LEVELS.length,
            ) * 0.4;

          // Radius Scale mapped area-accurately
          const counts = cells.map((c) => c.count);
          const radiusScale = d3
            .scaleSqrt()
            .domain([0, d3.max(counts) || 1])
            .range([3, maxCircleRadius]); // minimum 3px for outlines to preserve structure

          // Draw Matrix grid line intersections
          g.selectAll(".grid-line-x")
            .data(FULFILLMENT_LEVELS)
            .enter()
            .append("line")
            .attr("x1", 0)
            .attr("x2", chartWidth)
            .attr("y1", (d) => yScale(d))
            .attr("y2", (d) => yScale(d))
            .attr("stroke", "#f1f5f9")
            .attr("stroke-width", 2);

          g.selectAll(".grid-line-y")
            .data(xLevels)
            .enter()
            .append("line")
            .attr("x1", (d) => xScale(d))
            .attr("x2", (d) => xScale(d))
            .attr("y1", 0)
            .attr("y2", chartHeight)
            .attr("stroke", "#f1f5f9")
            .attr("stroke-width", 2);

          // Y-Axis Labels
          g.append("g")
            .attr("class", "text-slate-500 font-bold select-none")
            .call(d3.axisLeft(yScale))
            .call((g) => g.select(".domain").remove())
            .call((g) => g.selectAll(".tick line").remove())
            .selectAll("text")
            .style("font-size", "11px");

          // X-Axis Labels
          g.append("g")
            .attr("class", "text-slate-500 font-bold select-none")
            .attr("transform", `translate(0, ${chartHeight})`)
            .call(d3.axisBottom(xScale))
            .call((g) => g.select(".domain").remove())
            .call((g) => g.selectAll(".tick line").remove())
            .selectAll("text")
            .style("font-size", "11px")
            .attr("dy", "10")
            .call((g) => {
              // Adjust X axis labels text wrap or angle if screen is small
              if (width < 500) {
                g.attr("transform", "rotate(-15)").style("text-anchor", "end");
              }
            });

          // Label Axes headers
          svg
            .append("text")
            .attr("x", margin.left - 15)
            .attr("y", margin.top - 15)
            .attr(
              "class",
              "text-[10px] font-bold text-slate-400 uppercase tracking-widest text-right",
            )
            .text("Fulfillment");

          svg
            .append("text")
            .attr("x", width - margin.right)
            .attr("y", chartHeight + margin.top + 45)
            .attr(
              "class",
              "text-[10px] font-bold text-slate-400 uppercase tracking-widest text-right",
            )
            .text(xAxisTitle);

          // Cell circles groups
          const nodes = g
            .selectAll(".matrix-node")
            .data(cells)
            .enter()
            .append("g")
            .attr("class", "matrix-node")
            .attr(
              "transform",
              (d) =>
                `translate(${xScale(d.satisfaction)}, ${yScale(d.fulfillment)})`,
            )
            .style("cursor", "pointer")
            .on("click", (event, d) => {
              const cellKey = `${d.fulfillment}|${d.satisfaction}`;
              onSelectCell(cellKey === selectedCell ? null : cellKey);

              // Pulse transition animation on click
              d3.select(event.currentTarget)
                .select("circle")
                .transition()
                .duration(150)
                .attr("transform", "scale(1.25)")
                .transition()
                .duration(150)
                .attr("transform", "scale(1)");
            })
            .on("mousemove", (event, d) => {
              const bounds = container.getBoundingClientRect();
              const x = event.clientX - bounds.left;
              const y = event.clientY - bounds.top;
              setTooltip({
                show: true,
                x,
                y,
                count: d.count,
                ful: d.fulfillment,
                sat: d.satisfaction,
              });
            })
            .on("mouseleave", () => {
              setTooltip((prev) => ({ ...prev, show: false }));
            });

          // Programmatic cell styling: Aligned = Slate gray, Outlier = alert gold
          const getCellFill = (d) => {
            if (d.count === 0) return "none";
            const aligned = isAlignedCell(
              d.fulfillment,
              d.satisfaction,
              axisKey,
            );
            return aligned ? "#64748b" : "#C9B96C";
          };

          const getCellStroke = (d) => {
            if (d.count === 0) return "#cbd5e1";
            return "transparent";
          };

          // Render cell circles
          nodes
            .append("circle")
            .attr("r", 0) // start radius 0 for zoom entrance animation
            .attr("fill", getCellFill)
            .attr("stroke", getCellStroke)
            .attr("stroke-width", (d) => (d.count === 0 ? 1 : 2.5))
            .attr("stroke-dasharray", (d) => (d.count === 0 ? "3,3" : "none"))
            .attr("class", "transition-all duration-300 origin-center")
            .transition()
            .delay((d, idx) => idx * 25) // Staggered delays
            .duration(500)
            .attr("r", (d) => (d.count === 0 ? 4 : radiusScale(d.count)));

          // Text count labels inside circles
          nodes
            .append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "3.5")
            .attr("fill", "white")
            .attr("class", "font-bold text-xs select-none pointer-events-none")
            .style("opacity", (d) => (d.count > 0 ? 1.0 : 0))
            .text((d) => d.count);

          // Resize handler
          const handleResize = () => {
            if (!containerRef.current) return;
            const w = containerRef.current.clientWidth;
            const h = containerRef.current.clientHeight;
            svg.attr("width", w).attr("height", h);
            const cW = w - margin.left - margin.right;
            const cH = h - margin.top - margin.bottom;

            xScale.range([0, cW]);
            yScale.range([0, cH]);

            // Re-align elements instantly
            g.selectAll(".matrix-node").attr(
              "transform",
              (d) =>
                `translate(${xScale(d.satisfaction)}, ${yScale(d.fulfillment)})`,
            );
            g.selectAll(".grid-line-x")
              .attr("x2", cW)
              .attr("y1", (d) => yScale(d))
              .attr("y2", (d) => yScale(d));
            g.selectAll(".grid-line-y")
              .attr("x1", (d) => xScale(d))
              .attr("x2", (d) => xScale(d))
              .attr("y2", cH);
          };

          const resizeObserver = new ResizeObserver(handleResize);
          resizeObserver.observe(container);

          return () => resizeObserver.disconnect();
        }, [cells, xLevels, xAxisTitle, axisKey]);

        // Highlight selected cell without rebuilding the chart
        useEffect(() => {
          if (!svgRef.current) return;
          const svg = d3.select(svgRef.current);
          svg
            .selectAll(".matrix-node circle")
            .attr("stroke", function (d) {
              if (!d || d.count === 0) return "#cbd5e1";
              const key = `${d.fulfillment}|${d.satisfaction}`;
              return key === selectedCell ? "#0f172a" : "transparent";
            })
            .attr("fill", function (d) {
              if (!d || d.count === 0) return "none";
              const key = `${d.fulfillment}|${d.satisfaction}`;
              const aligned = isAlignedCell(
                d.fulfillment,
                d.satisfaction,
                axisKey,
              );
              if (key === selectedCell) return aligned ? "#334155" : "#A89A4E";
              return aligned ? "#64748b" : "#C9B96C";
            });
        }, [selectedCell, axisKey]);

        return (
          <div
            ref={containerRef}
            className="viz-fulfillment-grid w-full absolute inset-0"
          >
            <svg ref={svgRef} className="w-full h-full" />
          </div>
        );
      }

      // ── Reusable Row Tag with CODEBOOK hover tooltip ──────────
      // Use this for any row-tag displayed out of context (pills, inline labels).
      // NOT needed for h3 headings where the definition is shown statically below.
      // Tooltip renders via portal to escape overflow:hidden/auto ancestors.
      function RowTagWithTooltip({
        tag,
        className = "",
        style = {},
        children,
      }) {
        const entry = CODEBOOK[tag];
        const [hover, setHover] = useState(false);
        const spanRef = useRef(null);
        const [pos, setPos] = useState({ top: 0, left: 0 });

        const handleEnter = () => {
          if (!entry || !spanRef.current) return;
          const rect = spanRef.current.getBoundingClientRect();
          setPos({
            top: rect.top + window.scrollY - 8,
            left: rect.left + rect.width / 2,
          });
          setHover(true);
        };

        return (
          <span
            ref={spanRef}
            className={`cursor-help ${className}`}
            style={style}
            onMouseEnter={handleEnter}
            onMouseLeave={() => setHover(false)}
          >
            {children || tag}
            {hover &&
              entry &&
              ReactDOM.createPortal(
                <div
                  className="fixed bg-slate-900/95 text-white text-xs rounded-xl p-3 shadow-xl pointer-events-none border border-slate-700 z-[9999]"
                  style={{
                    top: `${pos.top}px`,
                    left: `${pos.left}px`,
                    transform: "translate(-50%, -100%)",
                    width: "260px",
                  }}
                >
                  <div className="font-bold border-b border-slate-700 pb-1.5 mb-1.5 tracking-wide flex justify-between items-center">
                    <span>{entry.fullName}</span>
                    <span
                      className={`text-[10px] ml-2 px-1.5 py-0.5 rounded-full font-bold shrink-0 ${entry.type === "Theme" ? "bg-[#7461F3] text-white" : "bg-[#F56939] text-white"}`}
                    >
                      {entry.code}
                    </span>
                  </div>
                  <div className="text-slate-300 leading-relaxed">
                    {entry.definition}
                  </div>
                </div>,
                document.body,
              )}
          </span>
        );
      }

            <div className="flex-1 overflow-y-auto space-y-5 no-scrollbar pr-1">

                {tagChartData.length === 0 ? (

                    {tagChartData.map((item, idx) => {

                      const percentWidth = Math.max(
                        8,
                        (item.count / maxVal) * 100,
                      );
                      const isTheme = item.type === "Theme";

                      return (
                        <div key={idx} className="space-y-1">

                              className={`h-full rounded-md transition-all duration-500 shadow-sm ${
                                isTheme
                                  ? "bg-gradient-to-r from-accent-theme to-accent-theme-light"
                                  : "bg-gradient-to-r from-accent-signal to-accent-signal-light"
                              }`}
                              style={{ width: `${percentWidth}%` }}
                            />
                          </div>

                    })}
                  </div>
                )}
              </div>

              {/* List of Respondents in Cell */}
              <div className="border-t border-slate-100 pt-4">
                <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">
