      // ── Barrier Bars Tab ────────────────────────────────────────
      function BarrierBarsTab({ data }) {
        const [axisKey, setAxisKey] = useState("tenure");
        const [segmentPanel, setSegmentPanel] = useState(null); // { category, groupLabel, respondents }
        const [tooltip, setTooltip] = useState({
          show: false,
          x: 0,
          y: 0,
          group: "",
          category: "",
          count: 0,
        });
        const svgRef = useRef(null);
        const containerRef = useRef(null);

        const axisOption = BARRIER_AXIS_OPTIONS.find((o) => o.key === axisKey);
        const groups = axisOption.groups;

        // Classify respondents
        const classified = useMemo(() => {
          return data.map((d) => ({
            ...d,
            barrierType: classifyBarrierType(d),
            groupValue: d[axisKey] || groups[0],
          }));
        }, [data, axisKey]);

        // Build stacked data: { groupLabel: { category: [respondents] } }
        const stackedData = useMemo(() => {
          const result = {};
          groups.forEach((g) => {
            result[g] = {};
            BARRIER_CATEGORY_ORDER.forEach((cat) => (result[g][cat] = []));
          });
          classified.forEach((d) => {
            const g = groups.includes(d.groupValue)
              ? d.groupValue
              : groups[groups.length - 1];
            result[g][d.barrierType].push(d);
          });
          return result;
        }, [classified, groups]);

        // Extracted draw function so it can be called on resize
        const drawChart = useRef(null);
        drawChart.current = (animate) => {
          if (!svgRef.current) return;
          const svg = d3.select(svgRef.current);
          const containerWidth =
            containerRef.current?.clientWidth ||
            svgRef.current.clientWidth ||
            800;
          const barHeight = 38;
          const barGap = 12;
          const margin = { top: 10, right: 60, bottom: 10, left: 160 };
          const height =
            margin.top + groups.length * (barHeight + barGap) + margin.bottom;
          const innerWidth = Math.max(
            0,
            containerWidth - margin.left - margin.right,
          );

          svg.attr("width", containerWidth).attr("height", height);

          // Always recreate the group to handle margin changes
          svg.selectAll("g.bar-chart").remove();
          const g = svg
            .append("g")
            .attr("class", "bar-chart")
            .attr("transform", `translate(${margin.left},${margin.top})`);

          // Max count for scale
          const maxCount = Math.max(
            ...groups.map((grp) =>
              BARRIER_CATEGORY_ORDER.reduce(
                (sum, cat) => sum + (stackedData[grp]?.[cat]?.length || 0),
                0,
              ),
            ),
            1,
          );

          const xScale = d3
            .scaleLinear()
            .domain([0, maxCount])
            .range([0, innerWidth]);

          groups.forEach((groupLabel, gi) => {
            const y = gi * (barHeight + barGap);
            let x = 0;

            // Group label
            g.append("text")
              .attr("x", -10)
              .attr("y", y + barHeight / 2)
              .attr("text-anchor", "end")
              .attr("dominant-baseline", "middle")
              .attr("fill", "#475569")
              .attr("font-size", "12px")
              .attr("font-weight", "600")
              .attr("font-family", "Outfit, sans-serif")
              .text(groupLabel);

            let totalCount = 0;

            BARRIER_CATEGORY_ORDER.forEach((cat) => {
              const members = stackedData[groupLabel]?.[cat] || [];
              const count = members.length;
              totalCount += count;
              if (count === 0) return;

              const segWidth = xScale(count);

              const rect = g
                .append("rect")
                .attr("x", x)
                .attr("y", y)
                .attr("width", animate ? 0 : segWidth)
                .attr("height", barHeight)
                .attr("rx", 4)
                .attr("fill", BARRIER_CATEGORIES[cat].color)
                .style("cursor", "pointer");

              if (animate) {
                rect
                  .transition()
                  .duration(600)
                  .delay(gi * 80)
                  .attr("width", segWidth);
              }

              // Count label inside segment if wide enough
              if (segWidth > 24) {
                g.append("text")
                  .attr("x", x + segWidth / 2)
                  .attr("y", y + barHeight / 2)
                  .attr("text-anchor", "middle")
                  .attr("dominant-baseline", "middle")
                  .attr("fill", "white")
                  .attr("font-size", "11px")
                  .attr("font-weight", "700")
                  .attr("font-family", "Outfit, sans-serif")
                  .attr("opacity", animate ? 0 : 1)
                  .text(count)
                  .transition()
                  .duration(animate ? 400 : 0)
                  .delay(animate ? gi * 80 + 300 : 0)
                  .attr("opacity", 1);
              }

              rect
                .on("mouseenter", function (event) {
                  d3.select(this).attr("opacity", 0.85);
                  const svgRect = svgRef.current.getBoundingClientRect();
                  setTooltip({
                    show: true,
                    x: event.clientX - svgRect.left,
                    y: event.clientY - svgRect.top - 10,
                    group: groupLabel,
                    category: cat,
                    count,
                  });
                })
                .on("mouseleave", function () {
                  d3.select(this).attr("opacity", 1);
                  setTooltip((prev) => ({ ...prev, show: false }));
                })
                .on("click", function () {
                  setSegmentPanel({
                    category: cat,
                    groupLabel,
                    respondents: members,
                  });
                });

              x += segWidth;
            });

            // Total n label to the right
            g.append("text")
              .attr("x", xScale(totalCount) + 8)
              .attr("y", y + barHeight / 2)
              .attr("dominant-baseline", "middle")
              .attr("fill", "#94a3b8")
              .attr("font-size", "11px")
              .attr("font-weight", "600")
              .attr("font-family", "Outfit, sans-serif")
              .text(`n=${totalCount}`);
          });
        };

        // Initial draw with animation when data/groups change
        useEffect(() => {
          drawChart.current(true);
        }, [stackedData, groups]);

        // Redraw without animation on container resize (sidebar open/close)
        useEffect(() => {
          if (!containerRef.current) return;
          const resizeObserver = new ResizeObserver(() => {
            drawChart.current(false);
          });
          resizeObserver.observe(containerRef.current);
          return () => resizeObserver.disconnect();
        }, []);

        const svgHeight = 10 + groups.length * 50 + 10;

        return (
          <div className="flex flex-col md:flex-row gap-6 min-h-0 max-h-[85vh]">
            {/* Main Visual Card */}
            <div className="flex-1 bg-white rounded-2xl border border-slate-200/60 shadow-sm p-6 flex flex-col min-h-0 relative">
              <div>
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 border-b border-slate-100 pb-4 mb-4">
                  <div>
                    <h2 className="text-xl font-bold tracking-tight text-slate-800">
                      Barriers to participation, grouped by Tenure
                    </h2>
                    <p className="text-xs text-slate-400 font-semibold">
                      Bars show what types of barriers each group names. Use the
                      selector to group by tenure, fulfillment, or governance
                      satisfaction.
                    </p>
                  </div>
                  <AxisControlBar
                    options={BARRIER_AXIS_OPTIONS}
                    activeKey={axisKey}
                    onChange={setAxisKey}
                  />
                </div>

                {/* Summary */}
                <div className="bg-slate-50 border-l-4 border-emerald-500 p-4 rounded-r-xl text-slate-600 text-sm mb-4 leading-relaxed">
                  Bars show what types of barriers each group names. Use the
                  selector to group by tenure, fulfillment, or governance
                  satisfaction.
                </div>

                {/* Legend */}
                <div className="mb-4">
                  <BarrierLegend />
                </div>
              </div>

              {/* Stacked Bars */}
              <div
                ref={containerRef}
                className="relative"
                style={{ height: `${svgHeight}px` }}
              >
                <svg
                  ref={svgRef}
                  className="w-full"
                  style={{ height: `${svgHeight}px` }}
                />
                {tooltip.show && (
                  <div
                    className="absolute bg-slate-900/95 text-white text-xs rounded-xl p-3 shadow-xl pointer-events-none z-30 border border-slate-700 max-w-[240px]"
                    style={{
                      left: `${tooltip.x + 12}px`,
                      top: `${tooltip.y}px`,
                    }}
                  >
                    <div className="font-bold text-sm mb-1">
                      {tooltip.group}
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span
                        className="w-2 h-2 rounded-full"
                        style={{
                          backgroundColor:
                            BARRIER_CATEGORIES[tooltip.category]?.color,
                        }}
                      />
                      <span>
                        {tooltip.category}: {tooltip.count}
                      </span>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Segment Sidebar Panel */}
            {segmentPanel && (
              <BarrierSegmentPanel
                category={segmentPanel.category}
                groupLabel={segmentPanel.groupLabel}
                respondents={segmentPanel.respondents}
                onClose={() => setSegmentPanel(null)}
              />
            )}
          </div>
        );
      }

      // Component to view and inspect raw Notion database entries
      function DatabaseViewerTab({ rawData, surveyData, anonymize }) {
        const [searchTerm, setSearchTerm] = useState("");
        const [viewMode, setViewMode] = useState("table"); // 'table' | 'json'
        const [expandedRow, setExpandedRow] = useState(null);

        // Helper to extract real name from page
        const getRealName = (page) => {
          return getPropValue(
            page,
            ["Name", "Respondent"],
            "title",
            "Anonymous",
          );
        };

        // Merge raw Notion records with their parsed/transformed equivalents
        const mergedData = useMemo(() => {
          if (!rawData) return [];
          return rawData.map((rawPage) => {
            const transformed =
              surveyData.find((s) => s.id === rawPage.id) || {};
            return {
              id: rawPage.id,
              realName: getRealName(rawPage),
              anonName: transformed.anonName || "Pending...",
              tenure: transformed.tenure || "0-2 yrs",
              fulfillment: transformed.fulfillment || "Somewhat",
              govSatisfaction:
                transformed.govSatisfaction || "Somewhat satisfied",
              hoursPerMonth: transformed.hoursPerMonth || "0-2",
              likert: transformed.likert || {},
              tags: transformed.tags || [],
              excerpts: transformed.excerpts || {},
              raw: rawPage,
            };
          });
        }, [rawData, surveyData]);

        // Filtered rows based on the search query
        const filteredData = useMemo(() => {
          if (!searchTerm.trim()) return mergedData;
          const term = searchTerm.toLowerCase();
          return mergedData.filter((item) => {
            return (
              item.id.toLowerCase().includes(term) ||
              (!anonymize && item.realName.toLowerCase().includes(term)) ||
              item.anonName.toLowerCase().includes(term) ||
              item.tenure.toLowerCase().includes(term) ||
              item.fulfillment.toLowerCase().includes(term) ||
              item.govSatisfaction.toLowerCase().includes(term) ||
              item.tags.some((t) => t.toLowerCase().includes(term)) ||
              Object.values(item.excerpts).some((txt) =>
                txt.toLowerCase().includes(term),
              )
            );
          });
        }, [mergedData, searchTerm]);

        // Render simple score with heatmap styling
        const renderScore = (val) => {
          if (val === undefined || val === null || isNaN(val)) return "-";
          let colorClasses = "bg-slate-100 text-slate-600 border-slate-200";
          if (val >= 4) {
            colorClasses = "bg-emerald-50 text-emerald-700 border-emerald-200";
          } else if (val <= 2) {
            colorClasses = "bg-rose-50 text-rose-700 border-rose-200";
          }
          return (
            <span
              className={`inline-flex items-center justify-center w-6 h-6 text-xs font-bold border rounded-md shadow-sm ${colorClasses}`}
            >
              {val}
            </span>
          );
        };

        const toggleExpand = (id) => {
          setExpandedRow((prev) => (prev === id ? null : id));
        };

        return (
          <div className="flex-grow bg-white rounded-2xl p-6 shadow-sm border border-slate-200/60 flex flex-col min-h-0">
            {/* Header */}
            <div className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-4">
              <div>
                <h2 className="text-xl font-bold text-slate-800">
                  Database Viewer
                </h2>
                <p className="text-slate-400 text-xs mt-1 font-semibold">
                  Inspect raw data from Notion and cross-reference with
                  anonymized entries
                </p>
              </div>

              <div className="flex items-center space-x-3 shrink-0">
                {/* Toggle view mode */}
                <div className="bg-slate-100 p-1 rounded-xl flex space-x-1 border border-slate-200/40">
                  <button
                    onClick={() => setViewMode("table")}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      viewMode === "table"
                        ? "bg-white text-slate-800 shadow-sm border border-slate-200/20"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    Table Grid
                  </button>
                  <button
                    onClick={() => setViewMode("json")}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      viewMode === "json"
                        ? "bg-white text-slate-800 shadow-sm border border-slate-200/20"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    Raw JSON
                  </button>
                </div>
              </div>
            </div>

            {/* Table Search & Help Callout */}
            {viewMode === "table" ? (
              <div className="flex flex-col space-y-4 mb-6">
                {/* Privacy Warning / Info */}
                <div className="bg-amber-50 border-l-4 border-amber-500/80 p-3 rounded-r-xl text-amber-800 text-xs font-medium shadow-sm">
                  <div className="flex items-center space-x-1.5">
                    <svg
                      className="h-4 w-4 text-amber-600 shrink-0"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        strokeWidth={2.5}
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                      />
                    </svg>
                    <span className="font-bold">
                      Privacy & Verification Tool
                    </span>
                  </div>
                  <p className="mt-1 text-amber-700 leading-relaxed">
                    This tab displays real database names (e.g. "Sarah Jenkins")
                    alongside anonymized pseudonyms (e.g. "Rowan-01") strictly
                    for database validation. These original identities are kept
                    fully localized to your browser and never exposed to
                    standard analytical views.
                  </p>
                </div>

                {/* Search bar */}
                <div className="relative max-w-md">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg
                      className="h-4 w-4 text-slate-400"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        strokeWidth={2}
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                      />
                    </svg>
                  </span>
                  <input
                    type="text"
                    placeholder="Search by name, pseudonym, tag, comment text..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 hover:bg-slate-100/70 focus:bg-white text-slate-800 border border-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl outline-none transition-all placeholder:text-slate-400 font-semibold shadow-inner"
                  />
                  {searchTerm && (
                    <button
                      onClick={() => setSearchTerm("")}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                    >
                      <svg
                        className="h-4 w-4"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          strokeWidth={2}
                          d="M6 18L18 6M6 6l12 12"
                        />
                      </svg>
                    </button>
                  )}
                </div>
              </div>
            ) : null}

            {/* Main Grid View */}
            <div className="flex-grow overflow-auto border border-slate-150 rounded-xl bg-slate-50/20 shadow-inner min-h-[300px]">
              {viewMode === "table" ? (
                filteredData.length === 0 ? (
                  <div className="flex flex-col items-center justify-center p-12 text-slate-400">
                    <svg
                      className="h-10 w-10 text-slate-300 mb-2"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        strokeWidth={2}
                        d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                      />
                    </svg>
                    <p className="text-sm font-semibold">
                      No matching records found.
                    </p>
                  </div>
                ) : (
                  <table className="w-full border-collapse text-left text-xs text-slate-700">
                    <thead className="sticky top-0 bg-slate-900 text-slate-100 font-bold uppercase tracking-wider select-none z-10">
                      <tr>
                        {!anonymize && (
                          <th className="px-4 py-3 font-semibold text-[10px]">
                            Real Name
                          </th>
                        )}
                        <th className="px-4 py-3 font-semibold text-[10px]">
                          Pseudonym
                        </th>
                        <th className="px-4 py-3 font-semibold text-[10px]">
                          Tenure
                        </th>
                        <th className="px-4 py-3 font-semibold text-[10px]">
                          Fulfillment
                        </th>
                        <th className="px-4 py-3 font-semibold text-[10px]">
                          Governance
                        </th>
                        <th className="px-4 py-3 font-semibold text-[10px]">
                          Scores (Q13-24)
                        </th>
                        <th className="px-4 py-3 font-semibold text-[10px]">
                          Tags
                        </th>
                        <th className="px-4 py-3 font-semibold text-[10px] text-center">
                          Essays
                        </th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200/80 bg-white">
                      {filteredData.map((item, idx) => {
                        const isExpanded = expandedRow === item.id;
                        return (
                          <React.Fragment key={item.id}>
                            <tr
                              className={`hover:bg-slate-50/50 transition-colors ${idx % 2 === 1 ? "bg-slate-50/20" : ""}`}
                            >
                              {!anonymize && (
                                <td className="px-4 py-3 font-bold text-slate-900 whitespace-nowrap">
                                  {item.realName}
                                </td>
                              )}
                              <td className="px-4 py-3 whitespace-nowrap">
                                <span className="px-2.5 py-1 bg-slate-950 text-white rounded-lg text-[10px] font-bold shadow-sm">
                                  {item.anonName}
                                </span>
                              </td>
                              <td className="px-4 py-3 font-semibold text-slate-500 whitespace-nowrap">
                                {item.tenure}
                              </td>
                              <td className="px-4 py-3 whitespace-nowrap">
                                <span
                                  className={`px-2 py-0.5 rounded-md font-bold border ${
                                    item.fulfillment === "Yes"
                                      ? "bg-emerald-50 border-emerald-200 text-emerald-700"
                                      : item.fulfillment === "No"
                                        ? "bg-rose-50 border-rose-200 text-rose-700"
                                        : "bg-amber-50 border-amber-200 text-amber-700"
                                  }`}
                                >
                                  {item.fulfillment}
                                </span>
                              </td>
                              <td className="px-4 py-3 whitespace-nowrap">
                                <span
                                  className={`px-2 py-0.5 rounded-md font-bold border ${
                                    item.govSatisfaction.includes("Very") ||
                                    (item.govSatisfaction.includes(
                                      "satisfied",
                                    ) &&
                                      !item.govSatisfaction.includes(
                                        "dissatisfied",
                                      ) &&
                                      !item.govSatisfaction.includes(
                                        "Somewhat",
                                      ))
                                      ? "bg-emerald-50 border-emerald-200 text-emerald-700"
                                      : item.govSatisfaction.includes(
                                            "dissatisfied",
                                          ) ||
                                          item.govSatisfaction.includes(
                                            "Not at all",
                                          )
                                        ? "bg-rose-50 border-rose-200 text-rose-700"
                                        : "bg-amber-50 border-amber-200 text-amber-700"
                                  }`}
                                >
                                  {item.govSatisfaction}
                                </span>
                              </td>
                              <td className="px-4 py-3">
                                <div className="flex items-center space-x-1">
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q13
                                    </span>
                                    {renderScore(item.likert.q13)}
                                  </div>
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q14
                                    </span>
                                    {renderScore(item.likert.q14)}
                                  </div>
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q15
                                    </span>
                                    {renderScore(item.likert.q15)}
                                  </div>
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q16
                                    </span>
                                    {renderScore(item.likert.q16)}
                                  </div>
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q22
                                    </span>
                                    {renderScore(item.likert.q22)}
                                  </div>
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q23
                                    </span>
                                    {renderScore(item.likert.q23)}
                                  </div>
                                  <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400 font-bold font-mono leading-none mb-0.5">
                                      Q24
                                    </span>
                                    {renderScore(item.likert.q24)}
                                  </div>
                                </div>
                              </td>
                              <td className="px-4 py-3">
                                <div className="flex flex-wrap gap-1 max-w-[200px]">
                                  {item.tags.map((tag, tagIdx) => {
                                    const isTheme = THEME_TAGS.includes(tag);
                                    return (
                                      <span
                                        key={tagIdx}
                                        className={`px-1.5 py-0.5 rounded border text-[9px] font-bold shadow-inner truncate ${
                                          isTheme
                                            ? "bg-[#7461F3]/10 border-[#7461F3]/25 text-[#7461F3]"
                                            : "bg-[#F56939]/10 border-[#F56939]/25 text-[#F56939]"
                                        }`}
                                        title={tag}
                                      >
                                        {tag}
                                      </span>
                                    );
                                  })}
                                </div>
                              </td>
                              <td className="px-4 py-3 text-center whitespace-nowrap">
                                <button
                                  onClick={() => toggleExpand(item.id)}
                                  className={`px-2.5 py-1 text-[10px] font-bold border rounded-lg transition-all flex items-center space-x-1 mx-auto ${
                                    isExpanded
                                      ? "bg-slate-800 text-white border-slate-700 shadow-inner"
                                      : "bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-300 shadow-sm"
                                  }`}
                                >
                                  <span>{isExpanded ? "Hide" : "View"}</span>
                                  <svg
                                    className={`h-3.5 w-3.5 transition-transform duration-300 ${isExpanded ? "rotate-180" : ""}`}
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                  >
                                    <path
                                      strokeLinecap="round"
                                      strokeLinejoin="round"
                                      strokeWidth={2.5}
                                      d="M19 9l-7 7-7-7"
                                    />
                                  </svg>
                                </button>
                              </td>
                            </tr>

                            {/* Expanded Qualitative Section */}
                            {isExpanded && (
                              <tr>
                                <td
                                  colSpan="8"
                                  className="bg-slate-50/70 p-6 border-b border-slate-200 shadow-inner"
                                >
                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-xl border border-slate-200/50 p-4 shadow-sm">
                                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                                        Favorite Part
                                      </h4>
                                      <p className="text-xs text-slate-700 font-medium leading-relaxed italic">
                                        {item.excerpts.favoritePart ? (
                                          `"${item.excerpts.favoritePart}"`
                                        ) : (
                                          <span className="text-slate-400 italic">
                                            No response provided
                                          </span>
                                        )}
                                      </p>
                                    </div>
                                    <div className="bg-white rounded-xl border border-slate-200/50 p-4 shadow-sm">
                                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                                        Areas of Growth
                                      </h4>
                                      <p className="text-xs text-slate-700 font-medium leading-relaxed italic">
                                        {item.excerpts.growthAreas ? (
                                          `"${item.excerpts.growthAreas}"`
                                        ) : (
                                          <span className="text-slate-400 italic">
                                            No response provided
                                          </span>
                                        )}
                                      </p>
                                    </div>
                                    <div className="bg-white rounded-xl border border-slate-200/50 p-4 shadow-sm">
                                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                                        Governance Comments
                                      </h4>
                                      <p className="text-xs text-slate-700 font-medium leading-relaxed italic">
                                        {item.excerpts.govComments ? (
                                          `"${item.excerpts.govComments}"`
                                        ) : (
                                          <span className="text-slate-400 italic">
                                            No response provided
                                          </span>
                                        )}
                                      </p>
                                    </div>
                                    <div className="bg-white rounded-xl border border-slate-200/50 p-4 shadow-sm">
                                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                                        Participation Barriers
                                      </h4>
                                      <p className="text-xs text-slate-700 font-medium leading-relaxed italic">
                                        {item.excerpts.barriers ? (
                                          `"${item.excerpts.barriers}"`
                                        ) : (
                                          <span className="text-slate-400 italic">
                                            No response provided
                                          </span>
                                        )}
                                      </p>
                                    </div>
                                  </div>
                                </td>
                              </tr>
                            )}
                          </React.Fragment>
                        );
                      })}
                    </tbody>
                  </table>
                )
              ) : (
                /* Beautiful formatting for Raw JSON payload */
                <div className="p-4 bg-slate-900 text-slate-200 text-xs font-mono select-text h-full overflow-y-auto leading-relaxed shadow-inner">
                  <pre>{JSON.stringify(rawData, null, 2)}</pre>
                </div>
              )}
            </div>

            {/* Bottom count badge */}
            <div className="mt-4 text-xs font-semibold text-slate-400 flex items-center justify-between">
              <span>
                Showing{" "}
                {viewMode === "table" ? filteredData.length : rawData.length} of{" "}
                {rawData.length} total entries
              </span>
              <span>CVC Survey Explorer</span>
            </div>
          </div>
        );
      }

      // Hydrate root react element
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
